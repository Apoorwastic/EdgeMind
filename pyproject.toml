[project]
name = "edgemind"
version = "0.1.0"
requires-python = ">=3.12"
# Keep in sync with requirements.txt (used by the Dockerfile).
dependencies = [
    "qdrant-edge-py==0.8.0",
    "qdrant-client>=1.15",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "openai>=1.50",
    "python-dotenv>=1.0",
]

[tool.vercel]
entrypoint = "edge.app:app"
