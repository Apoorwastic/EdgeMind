services:
  - type: web
    name: edgemind
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Free tier: 512 MB RAM, no payment info needed. Ollama (qwen2.5:3b, ~2 GB) + Qdrant + two Python
    # device processes + Caddy in one container will almost certainly be OOM-killed at this size — this
    # project's own README asks for ~8 GB (plan 2c-8g) for a reason. Use free only to see the Blueprint
    # deploy and the gateway page come up; switch back to a paid plan for the app to actually answer.
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: CLOUD_API_KEY
        sync: false # optional: set in the Render dashboard for fast cloud answers; leave unset to stay fully on-device
      - key: CLOUD_MODEL
        value: gpt-4o-mini # provider auto-detected from this name — see edge/llm.py
      - key: ASK_RATE_LIMIT
        value: "20"
      - key: SEED_SCENARIO
        value: home
    # Free tier doesn't support persistent disks — data resets on every restart/deploy. SEED_DEMO
    # re-seeds automatically in that case (same caveat as the README's Hugging Face Spaces section).
